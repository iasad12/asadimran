<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asad Imran Shah - Business Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');

        :root {
            --brand-bg: #0a001f;
            --brand-accent: #00ff9d;
            --brand-text: #ffffff;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050110;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 40px 0;
            gap: 40px;
        }

        .card-container {
            width: 336px; /* 3.5 inches at 96dpi */
            height: 192px; /* 2 inches at 96dpi */
            overflow: visible;
        }

        .card {
            width: 336px;
            height: 192px;
            background-color: var(--brand-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
        }

        .space-grotesk {
            font-family: 'Space Grotesk', sans-serif;
        }

        .grid-bg {
            background-image: radial-gradient(circle at 1.5px 1.5px, rgba(0, 255, 157, 0.08) 1px, transparent 0);
            background-size: 12px 12px;
        }

        .glow {
            position: absolute;
            width: 180px;
            height: 180px;
            background: var(--brand-accent);
            filter: blur(80px);
            opacity: 0.12;
            border-radius: 50%;
        }

        .abstract-element {
            position: absolute;
            border: 1px solid rgba(0, 255, 157, 0.1);
            border-radius: 50%;
        }

        @media print {
            body { background: white; margin: 0; padding: 0; min-height: auto; }
            .no-print { display: none !important; }
            .card-container { margin: 20px; page-break-inside: avoid; border: none; }
            .card { border: 1px solid #eee; box-shadow: none; }
        }
    </style>
</head>
<body>

    <div class="no-print text-white/40 text-sm mb-2 space-grotesk tracking-widest uppercase flex items-center gap-4">
        <span>Front Side</span>
        <button onclick="downloadCard('card-front', 'BusinessCard-Front')" class="text-[#00ff9d] hover:text-white transition-colors text-xs font-bold border border-[#00ff9d]/30 px-2 py-1 uppercase tracking-tighter">Download PNG</button>
    </div>

    <!-- FRONT SIDE -->
    <div class="card-container">
        <div id="card-front" class="card grid-bg flex flex-col items-center justify-center">
            <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-bl from-[#00ff9d]/15 to-transparent"></div>
            <div class="glow -top-10 -right-10"></div>
            <div class="glow -bottom-20 -left-20"></div>
            <div class="abstract-element w-64 h-64 -top-32 -left-32"></div>
            <div class="abstract-element w-48 h-48 -bottom-24 -right-12"></div>
            
            <div class="relative z-10 text-center px-8 w-full">
                <div class="flex items-center justify-center mb-3">
                    <img src="https://asadimran.pages.dev/images/logo.webp" alt="Logo" class="h-12 w-auto">
                </div>
                <h1 class="space-grotesk text-3xl font-bold tracking-tight text-white uppercase leading-none mb-4">
                    Asad Imran <span class="text-[#00ff9d]">Shah</span>
                </h1>
                <div class="relative flex items-center justify-center mb-4">
                    <div class="h-[1px] w-full bg-gradient-to-r from-transparent via-[#00ff9d]/40 to-transparent"></div>
                    <div class="absolute w-2 h-2 bg-[#00ff9d] rotate-45"></div>
                </div>
                <p class="text-[10px] tracking-[0.4em] text-[#00ff9d] uppercase font-bold opacity-90">
                    AI Dev & Content Writer
                </p>
            </div>
        </div>
    </div>

    <div class="no-print text-white/40 text-sm mb-2 mt-8 space-grotesk tracking-widest uppercase flex items-center gap-4">
        <span>Back Side</span>
        <button onclick="downloadCard('card-back', 'BusinessCard-Back')" class="text-[#00ff9d] hover:text-white transition-colors text-xs font-bold border border-[#00ff9d]/30 px-2 py-1 uppercase tracking-tighter">Download PNG</button>
    </div>

    <!-- BACK SIDE -->
    <div class="card-container">
        <div id="card-back" class="card flex items-stretch">
            <div class="w-1.5 bg-gradient-to-b from-[#00ff9d] to-[#6d28d9]"></div>
            
            <div class="flex-grow p-6 flex flex-col justify-center relative">
                <div class="glow top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 opacity-[0.05]"></div>
                <div class="mb-2 text-left">
                    <h2 class="space-grotesk text-xl font-bold text-white uppercase tracking-tight">Contact</h2>
                </div>

                <div class="space-y-2.5 relative z-10 text-left">
                    <div class="flex items-center gap-3">
                        <div class="w-6 h-6 rounded bg-white/5 flex items-center justify-center border border-white/10">
                            <svg class="w-3.5 h-3.5 text-[#00ff9d]" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                        </div>
                        <span class="text-[10px] text-gray-200 font-semibold tracking-wide">+92 304 6769150</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="w-6 h-6 rounded bg-white/5 flex items-center justify-center border border-white/10">
                            <svg class="w-3 h-3 text-[#00ff9d]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                        </div>
                        <span class="text-[10px] text-gray-200 font-semibold tracking-wide">asadimran328@gmail.com</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="w-6 h-6 rounded bg-white/5 flex items-center justify-center border border-white/10">
                            <svg class="w-3 h-3 text-[#00ff9d]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/></svg>
                        </div>
                        <span class="text-[10px] text-gray-200 font-semibold tracking-wide">asadimran.pages.dev</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="w-6 h-6 rounded bg-white/5 flex items-center justify-center border border-white/10">
                            <svg class="w-3 h-3 text-[#00ff9d]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        </div>
                        <span class="text-[10px] text-gray-200 font-semibold tracking-wide uppercase">Mianwali, Pakistan</span>
                    </div>
                </div>
            </div>

            <div class="w-32 bg-[#050110] border-l border-white/5 flex flex-col items-center justify-center p-4">
                <div class="p-1.5 bg-white rounded shadow-[0_0_15px_rgba(0,255,157,0.1)]">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://asadimran.pages.dev&color=0a001f" alt="QR Code" class="w-16 h-16">
                </div>
                <p class="text-[8px] text-[#00ff9d] uppercase mt-3 tracking-[0.2em] text-center font-bold opacity-70 leading-tight">Scan for<br>Portfolio</p>
            </div>
        </div>
    </div>

    <div class="no-print mt-12 flex flex-col items-center gap-6">
        <div class="flex gap-4">
            <button onclick="window.print()" class="bg-white text-[#0a001f] px-8 py-3 font-bold uppercase hover:bg-[#00ff9d] transition-all transform hover:scale-105 shadow-xl shadow-black/50">
                Print Card / Save PDF
            </button>
            <button onclick="downloadAll()" class="bg-[#00ff9d] text-[#0a001f] px-8 py-3 font-bold uppercase hover:bg-white transition-all transform hover:scale-105 shadow-xl shadow-[#00ff9d]/20">
                Download as PNG
            </button>
        </div>
        <p class="text-white/40 text-[10px] uppercase tracking-[0.3em]">Mianwali • Pakistan • Global</p>
    </div>

    <script>
        async function downloadCard(elementId, fileName) {
            const element = document.getElementById(elementId);
            const scale = 3;
            
            try {
                await document.fonts.ready;
                // Capture using html-to-image with specific background
                const dataUrl = await htmlToImage.toPng(element, {
                    pixelRatio: scale,
                    backgroundColor: '#0a001f',
                    style: {
                        borderRadius: '0' // Sharp corners for print-ready files
                    }
                });
                
                const link = document.createElement('a');
                link.download = `${fileName}.png`;
                link.href = dataUrl;
                link.click();
            } catch (error) {
                console.error('Error generating image:', error);
                alert('Image generation error. This often happens due to security restrictions when opening files locally. \n\nFor the best results, use "Print Card" and save as PDF.');
            }
        }

        async function downloadAll() {
            await downloadCard('card-front', 'AsadImran-BusinessCard-Front');
            setTimeout(() => {
                downloadCard('card-back', 'AsadImran-BusinessCard-Back');
            }, 1000);
        }
    </script>
</body>
</html>
